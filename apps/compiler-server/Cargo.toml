[package]
name = "tikzforge-compiler-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
http-body-util = "0.1"
tikzforge-graphic-ir = { path = "../../crates/graphic-ir" }
tikzforge-tikz-serializer = { path = "../../crates/tikz-serializer" }
